    <rect x="0" y="12" width="10" height="50" fill="#2a1a4a"/>
    <rect x="70" y="12" width="10" height="50" fill="#2a1a4a"/>
    <rect x="10" y="12" width="60" height="50" fill="#f1c27d"/>
    <rect x="14" y="26" width="52" height="12" fill="#00b4d8"/>
