    <line x1="350" y1="119" x2="480" y2="170"/>
    <line x1="350" y1="119" x2="545" y2="170"/>
    <line x1="350" y1="119" x2="610" y2="170"/>
    <line x1="350" y1="119" x2="675" y2="170"/>
