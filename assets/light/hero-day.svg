  <text x="140" y="86" font-family="'Courier New',Courier,monospace" font-weight="bold" font-style="italic" font-size="42" letter-spacing="2" fill="url(#chrome)" stroke="#3a0ca3" stroke-width="3.5" paint-order="stroke" stroke-linejoin="round" filter="url(#glow)">GORDON_OH.EXE</text>
  <text x="140" y="86" font-family="'Courier New',Courier,monospace" font-weight="bold" font-style="italic" font-size="42" letter-spacing="2" fill="url(#sheen)">GORDON_OH.EXE</text>
