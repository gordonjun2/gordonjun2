<svg xmlns="http://www.w3.org/2000/svg" width="700" height="170" viewBox="0 0 700 170" role="img" aria-label="GORDON_OH.EXE has entered the chat">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="170">
      <stop offset="0" stop-color="#ff8fd8"/>
      <stop offset="0.5" stop-color="#ffd3a3"/>
      <stop offset="1" stop-color="#8be9ff"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.45" stop-color="#ff5fa2"/>
      <stop offset="0.75" stop-color="#e0318f"/>
      <stop offset="1" stop-color="#8c1eff"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0087c9"/>
      <stop offset="0.38" stop-color="#e0f7ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#ffb1e8"/>
      <stop offset="1" stop-color="#e0318f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d40078"/>
      <stop offset="0.5" stop-color="#7a3cff"/>
      <stop offset="1" stop-color="#0092c9"/>
    </linearGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="180" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="100;640" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="160;700" dur="3.8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#0d0221" opacity="0.03"/>
