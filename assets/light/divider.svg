<svg xmlns="http://www.w3.org/2000/svg" width="700" height="6" viewBox="0 0 700 6" role="img" aria-label="neon divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d40078"/>
      <stop offset="0.5" stop-color="#7a3cff"/>
      <stop offset="1" stop-color="#0092c9"/>
    </linearGradient>
    <filter id="dgglow" x="-5%" y="-150%" width="110%" height="400%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="1.5" width="700" height="3" rx="1.5" fill="url(#dg)" filter="url(#dgglow)"/>
  <rect x="344" y="-3" width="12" height="12" rx="2" fill="#ffb703" transform="rotate(45 350 3)"/>
</svg>
