<svg xmlns="http://www.w3.org/2000/svg" width="700" height="170" viewBox="0 0 700 170" role="img" aria-label="GORDON_OH.EXE has entered the chat">
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="170">
      <stop offset="0" stop-color="#ffd9f0"/>
      <stop offset="1" stop-color="#b7f0ff"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdf7e"/>
      <stop offset="1" stop-color="#ff9ad5"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0092c9"/>
      <stop offset="0.5" stop-color="#7a3cff"/>
      <stop offset="1" stop-color="#d40078"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#0d0221" opacity="0.04"/>
    </pattern>
    <clipPath id="suncut"><circle cx="350" cy="120" r="85"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="700" height="170" fill="url(#sky)"/>
  <circle cx="350" cy="120" r="85" fill="url(#sun)"/>
  <g clip-path="url(#suncut)" fill="url(#sky)">
    <rect x="255" y="96" width="190" height="4"/>
    <rect x="255" y="108" width="190" height="6"/>
    <rect x="255" y="124" width="190" height="8"/>
    <rect x="255" y="142" width="190" height="10"/>
    <rect x="255" y="162" width="190" height="12"/>
  </g>
  <g stroke="#0e7fa3" stroke-width="1" opacity="0.4">
    <line x1="350" y1="120" x2="350" y2="170"/>
    <line x1="350" y1="120" x2="230" y2="170"/>
    <line x1="350" y1="120" x2="110" y2="170"/>
    <line x1="350" y1="120" x2="-10" y2="170"/>
    <line x1="350" y1="120" x2="470" y2="170"/>
    <line x1="350" y1="120" x2="590" y2="170"/>
    <line x1="350" y1="120" x2="710" y2="170"/>
    <line x1="0" y1="126" x2="700" y2="126"/>
    <line x1="0" y1="134" x2="700" y2="134"/>
    <line x1="0" y1="146" x2="700" y2="146"/>
    <line x1="0" y1="162" x2="700" y2="162"/>
  </g>
  <rect width="700" height="170" fill="url(#scan)"/>
  <g transform="translate(34,45)" shape-rendering="crispEdges">
    <rect x="0" y="0" width="80" height="20" fill="#2a1a4a"/>
    <rect x="0" y="20" width="80" height="60" fill="#f1c27d"/>
    <rect x="0" y="0" width="10" height="80" fill="#2a1a4a"/>
    <rect x="70" y="0" width="10" height="80" fill="#2a1a4a"/>
    <rect x="0" y="70" width="80" height="10" fill="#2a1a4a"/>
    <rect x="8" y="32" width="64" height="12" fill="#00b4d8"/>
    <rect x="25" y="55" width="30" height="10" fill="#2a1a4a"/>
  </g>
  <text x="140" y="86" font-family="'Courier New',Courier,monospace" font-weight="bold" font-style="italic" font-size="42" letter-spacing="2" fill="url(#neon)" filter="url(#glow)">GORDON_OH.EXE</text>
  <rect x="504" y="52" width="20" height="38" fill="#d40078">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="142" y="122" font-family="'Courier New',Courier,monospace" font-size="17" fill="#0087a8">&gt; has entered the chat_</text>
</svg>
