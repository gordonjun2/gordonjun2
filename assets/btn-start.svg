<svg xmlns="http://www.w3.org/2000/svg" width="200" height="52" viewBox="0 0 200 52" role="img" aria-label="Press start — email me">
  <defs>
    <linearGradient id="bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#01cdfe"/>
      <stop offset="0.5" stop-color="#b967ff"/>
      <stop offset="1" stop-color="#ff2a95"/>
    </linearGradient>
    <filter id="bng" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="196" height="48" rx="10" fill="#0d0221"/>
  <rect x="3" y="3" width="194" height="46" rx="9" fill="none" stroke="url(#bn)" stroke-width="1.5" filter="url(#bng)"/>
  <text x="92" y="31" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="14" letter-spacing="2" fill="#ffffff">▶ PRESS START</text>
  <rect x="150" y="18" width="9" height="16" fill="#ff2a95">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
