<svg xmlns="http://www.w3.org/2000/svg" width="320" height="54" viewBox="0 0 320 54" role="img" aria-label="Join sisc.club">
  <defs>
    <linearGradient id="bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#01cdfe"/>
      <stop offset="0.5" stop-color="#b967ff"/>
      <stop offset="1" stop-color="#ff2a95"/>
    </linearGradient>
    <filter id="bng" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="316" height="50" rx="12" fill="#0d0221"/>
  <rect x="3" y="3" width="314" height="48" rx="11" fill="none" stroke="url(#bn)" stroke-width="1.5" filter="url(#bng)"/>
  <text x="160" y="25" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="17" letter-spacing="2" fill="#ffffff">▶ SISC.CLUB</text>
  <text x="160" y="42" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" letter-spacing="3" fill="#ff71ce">CO-OP SERVER — ONLINE
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </text>
</svg>
