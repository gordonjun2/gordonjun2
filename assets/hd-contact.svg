<svg xmlns="http://www.w3.org/2000/svg" width="360" height="56" viewBox="0 0 360 56" role="img" aria-label="CONTACT">
  <defs>
    <linearGradient id="bn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#01cdfe"/>
      <stop offset="0.5" stop-color="#b967ff"/>
      <stop offset="1" stop-color="#ff2a95"/>
    </linearGradient>
    <filter id="bng" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="356" height="52" rx="26" fill="#0d0221"/>
  <rect x="3" y="3" width="354" height="50" rx="25" fill="none" stroke="url(#bn)" stroke-width="1.5" filter="url(#bng)"/>
  <text x="180" y="36" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="20" letter-spacing="3" fill="#ffffff">👾 CONTACT</text>
